# Altyazı+ (Burak Topcu) – otomatik derleme.
# Her yüklemede: Windows programı (AltyaziPlus.exe) + Android TV uygulaması (.apk) derlenir.
# main dalına her yüklemede bunlar GitHub "Releases" sayfasına konur: sürüm numarası VERSION dosyasından
# (VERSION'u değiştirince yeni sürüm açılır, aynı kalırsa mevcut sürümün dosyaları güncellenir).
name: Derle

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # PS5 bağlantı yardımcısı (tools/ps5-baglanti): ayrı program, chiaki-ng kütüphanesi + FFmpeg H.264 çözücüsüyle
  # MSYS2/MinGW'de statik derlenir (yalnız Windows DLL'lerine bağlı tek .exe).
  ps5-baglanti:
    name: PS5 bağlantı yardımcısı
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      FF_VER: "7.1.2"
    steps:
      - uses: actions/checkout@v4
      - name: chiaki-ng kaynakları
        shell: pwsh
        run: |
          git submodule update --init --depth 1 third-party/chiaki-ng
          git -C third-party/chiaki-ng submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make tar xz
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm mingw-w64-x86_64-python mingw-w64-x86_64-python-protobuf mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-openssl mingw-w64-x86_64-json-c mingw-w64-x86_64-libevent mingw-w64-x86_64-miniupnpc
      - name: FFmpeg önbelleği
        id: ff
        uses: actions/cache@v4
        with:
          path: ff
          key: ff-${{ env.FF_VER }}-mingw64-h264-only
      - name: FFmpeg (yalnız H.264 çözücü + swscale, statik)
        if: steps.ff.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 4 -o ff.tar.gz "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${FF_VER}.tar.gz"
          mkdir ff-src && tar -xzf ff.tar.gz -C ff-src --strip-components=1
          cd ff-src
          ./configure --prefix="$GITHUB_WORKSPACE/ff" --enable-static --disable-shared --disable-debug --disable-programs \
            --disable-doc --disable-network --disable-autodetect --enable-w32threads --disable-everything \
            --disable-avformat --disable-avdevice --disable-avfilter --disable-swresample \
            --enable-decoder=h264 --enable-parser=h264
          make -j4 && make install
      - name: Derle
        run: |
          cmake -S tools/ps5-baglanti -B build/ps5 -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="$GITHUB_WORKSPACE/ff"
          cmake --build build/ps5
      - name: Denetle (yalnız Windows DLL'leri)
        run: |
          objdump -p build/ps5/ps5-baglanti.exe | grep 'DLL Name' | tee dlls.txt
          if grep -viE 'DLL Name: (kernel32|user32|advapi32|shell32|ole32|oleaut32|gdi32|ws2_32|iphlpapi|bcrypt|crypt32|secur32|normaliz|msvcrt|ntdll|ucrtbase|api-ms-win-[a-z0-9-]+)\.dll' dlls.txt; then
            echo "Beklenmeyen DLL bağımlılığı"; exit 1
          fi
          build/ps5/ps5-baglanti.exe wake 127.0.0.1 1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-baglanti
          path: build/ps5/ps5-baglanti.exe
          if-no-files-found: error

  windows:
    name: Windows programı
    needs: ps5-baglanti
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ps5-baglanti
          path: src/Ps5Altyazi/native
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Derle (tek dosya .exe)
        run: dotnet publish src\Ps5Altyazi\Ps5Altyazi.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
      - name: PS5 bağlantı yardımcısı programın içinde mi
        shell: pwsh
        run: |
          if (-not (Test-Path src\Ps5Altyazi\native\ps5-baglanti.exe)) { throw "ps5-baglanti.exe indirilemedi" }
          $exe = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("publish\AltyaziPlus.exe"))
          if (-not $exe.Contains("WebView2Loader.dll")) { throw "WebView2Loader.dll AltyaziPlus.exe'nin içinde yok" }
          $dll = Get-ChildItem -Recurse src\Ps5Altyazi\obj -Filter AltyaziPlus.dll | Where-Object { $_.FullName -match 'win-x64' } | Select-Object -First 1
          $meta = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll.FullName))
          if (-not $meta.Contains("ps5-baglanti.exe")) { throw "ps5-baglanti.exe programa gömülmedi" }
          "tamam ($([math]::Round($dll.Length/1MB,1)) MB)"
      - name: Kurulum dosyası (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Get-Content VERSION -Raw).Trim()
          & $iscc /Qp "/DMyVersion=$ver" installer\AltyaziPlus.iss
          if ($LASTEXITCODE -ne 0) { throw "kurulum derlenemedi" }
          Get-Item publish\AltyaziPlus-Setup.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: AltyaziPlus-Windows
          path: publish\*.exe

  android:
    name: Android TV uygulaması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Derle (.apk)
        run: |
          gradle -p tv/android assembleDebug --no-daemon
          cp tv/android/app/build/outputs/apk/debug/app-debug.apk AltyaziPlus-AndroidTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AltyaziPlus-AndroidTV
          path: AltyaziPlus-AndroidTV.apk

  tv-paketleri:
    name: LG ve Samsung paketleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Samsung (Tizen) kaynak paketi
        run: |
          mkdir -p out/AltyaziPlus-Samsung
          cp tv/web/index.html tv/web/app.js tv/tizen/config.xml tv/tizen/icon.png out/AltyaziPlus-Samsung/
          cd out && zip -r AltyaziPlus-Samsung-Tizen.zip AltyaziPlus-Samsung
      - name: LG (webOS) paketi
        run: cp tv/*.ipk out/
      - uses: actions/upload-artifact@v4
        with:
          name: AltyaziPlus-TV-Paketleri
          path: |
            out/*.zip
            out/*.ipk

  release:
    name: Sürüm yayınla
    if: github.ref == 'refs/heads/main'
    needs: [windows, android, tv-paketleri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm numarası
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: AltyaziPlus-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Altyazı+ v${{ steps.v.outputs.version }}
          make_latest: true
          overwrite_files: true
          body: |
            **Altyazı+** – PS5 oyunları için canlı Türkçe çeviri. Yapımcı: Burak Topcu.
            Kurulum: depodaki KURULUM.md dosyasına bakın.
            - AltyaziPlus-Setup.exe – Windows kurulumu (önerilen; program içinden "Şimdi güncelle" ile güncellenir)
            - AltyaziPlus.exe – Windows programı, kurulumsuz tek dosya
            - AltyaziPlus-AndroidTV.apk – Android TV / Google TV uygulaması
            - tr.ps5altyazi.tv_*.ipk – LG webOS uygulaması (PC programı kendisi kurar)
            - AltyaziPlus-Samsung-Tizen.zip – Samsung TV uygulaması (Tizen Studio ile kurulur)
          files: dist/*
