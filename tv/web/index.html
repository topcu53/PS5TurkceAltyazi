<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Altyazı+</title>
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: "LG Smart UI", "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }
  #hdmi { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #000; }
  #sub {
    position: absolute; left: 50%; bottom: 90px; max-width: 1690px; display: none;
    -webkit-transform: translateX(-50%); transform: translateX(-50%);
    padding: 10px 32px 14px; border-radius: 14px; background: rgba(0, 0, 0, 0.6);
    font-size: 46px; font-weight: bold; line-height: 1.22; text-align: center;
    text-shadow: 0 2px 6px #000, 0 0 2px #000; box-sizing: border-box;
    display: none; -webkit-box-align: center; -webkit-box-pack: center;
  }
  #sub.notice { color: #ffd400; font-size: 34px; }
  #screen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
  #screen .sbox {
    position: absolute; box-sizing: border-box; padding: 1px 4px; border-radius: 4px; background: #000; color: #fff;
    font-weight: bold; line-height: 1.12; white-space: normal; word-wrap: break-word; text-shadow: none;
  }
  #mask { position: absolute; display: none; background: #000; border-radius: 12px; }
  #status {
    position: absolute; right: 30px; top: 24px; padding: 10px 18px; border-radius: 10px;
    background: rgba(0, 0, 0, 0.7); font-size: 24px; color: #ffb03b; display: none;
  }
  #panel {
    position: absolute; left: 50%; top: 50%; width: 1100px; margin-left: -550px; margin-top: -300px;
    padding: 36px 44px; border-radius: 18px; background: rgba(20, 24, 32, 0.95); border: 2px solid #3a3f47;
    font-size: 28px; line-height: 1.5; display: none;
  }
  #panel h1 { margin: 0 0 14px; font-size: 40px; color: #50a0ff; }
  #panel .ip span { display: inline-block; min-width: 90px; padding: 4px 10px; margin: 0 6px; text-align: center;
    border-radius: 8px; background: #23262b; font-size: 40px; }
  #panel .ip span.sel { background: #ffd400; color: #000; }
  #panel .hint { color: #9aa0a6; font-size: 24px; margin-top: 16px; }
</style>
</head>
<body>
  <video id="hdmi" autoplay></video>
  <div id="screen"></div>
  <div id="mask"></div>
  <div id="sub"></div>
  <div id="status"></div>
  <div id="panel"></div>
  <script src="app.js"></script>
</body>
</html>
